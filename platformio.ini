; ============================================================================
; DripMeter — acoustic ceiling-leak droplet monitor
; Target: Guition JC3248W535 (ESP32-S3, 3.5" 320x480 AXS15231B QSPI display)
;
; HARDWARE NOTES (verified on this unit, Oct 2026):
;   * The flash chip is 8 MB (N8R8 module), despite 16 MB in Guition's spec.
;     Any 16 MB partition scheme crashes at boot. This is why this file
;     pins flash_size=8MB + partitions_8MB.csv.
;   * Flash runs DIO @ 80 MHz; PSRAM is 8 MB octal (OPI) @ 80 MHz.
;   * Native USB only (no UART bridge) -> upload over USB-Serial-JTAG.
;
; TOOLCHAIN NOTES:
;   * Official espressif32 platforms (Arduino core 3.0.x) boot-loop on this
;     board. The proven stack is pioarduino (Arduino core 3.3.x on IDF 5.5),
;     validated overnight on JC3248W535 hardware by the FusionEdge project.
;   * pioarduino needs PlatformIO Core >= 6.2. If the system `pio` is older
;     (check `pio --version`), install the pioarduino core once:
;
;       curl -fsSL -o get-platformio.py https://raw.githubusercontent.com/pioarduino/pioarduino-core-installer/pioarduino/get-platformio.py
;       python3 get-platformio.py
;
;     then use  ~/.platformio/penv/bin/pio  for this project.
; ============================================================================

[platformio]
default_envs = jc3248w535

[env:jc3248w535]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Upload / monitor ------------------------------------------------------
; esp-builtin = esptool over the ESP32-S3 ROM USB-Serial-JTAG bootloader.
; The board's USB-C is wired to the USB-Serial-JTAG peripheral (no UART
; bridge, no USB-OTG connector), so the console is HWCDC on that SAME port
; (/dev/cu.usbmodem*). Leave USB-CDC-on-boot OFF: a tinyusb CDC console
; would enumerate nowhere on this hardware.
upload_protocol = esp-builtin
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Flash / PSRAM / partitions (see hardware notes above) -----------------
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi   ; octal (OPI) PSRAM
board_build.psram_type = opi
board_build.partitions = partitions_8MB.csv ; 2 MB app + ~5.7 MB LittleFS

build_flags =
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM             ; 320x480 canvas framebuffer lives in PSRAM
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_RUNNING_CORE=0      ; UI loop on core 0 (with WiFi/web, both
    -D ARDUINO_EVENT_RUNNING_CORE=0 ; light) — the priority-20 sampler gets
                                    ; core 1 entirely to itself, no more
                                    ; render starvation

lib_deps =
    ; Proven display stack for the AXS15231B on this exact board
    ; (LovyanGFX / TFT_eSPI have no AXS15231B panel driver). Arduino core
    ; 3.3.x provides the periman API that GFX 1.6+ requires.
    moononournation/GFX Library for Arduino@^1.5.0
    ; Professional bitmap fonts (u8g2), auto-detected by Arduino_GFX.
    olikraus/U8g2@^2.35.30
